# ============================================================
#           PLANORA - APPLICATION CONFIGURATION
# ============================================================

# -------------------- SERVER --------------------
server.port=8111
server.servlet.context-path=/api

# -------------------- DATABASE --------------------
spring.datasource.url=jdbc:mysql://localhost:3306/planora_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------- JPA / HIBERNATE --------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------- JWT --------------------
app.jwt.secret=PlanoraSuperSecretKey2026PlanoraSuperSecretKey2026PlanoraSuperSecretKey2026
app.jwt.expiration=86400000

# -------------------- FILE UPLOAD --------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/

# -------------------- LOGGING --------------------
logging.level.com.planora=DEBUG
logging.level.org.springframework.security=WARN

# -------------------- OPEN-IN-VIEW --------------------
spring.jpa.open-in-view=false
